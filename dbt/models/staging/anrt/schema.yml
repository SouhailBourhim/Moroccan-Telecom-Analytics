version: 2

models:
  - name: stg_anrt__mobile
    description: Mobile subscriber counts per operator, quarter, and year
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, quarter, operator]
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: operator
        tests:
          - not_null
          - accepted_values:
              values: ['Maroc Telecom', 'Orange Maroc', 'Inwi']
      - name: total_subs
        description: Total mobile subscriptions (thousands)
        tests: [not_null]

  - name: stg_anrt__internet
    description: Internet subscriptions by technology and quarter
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, quarter, technology]
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: technology
        tests:
          - not_null
          - accepted_values:
              values: ['ADSL', 'FTTH', 'Mobile', 'Leased', 'Other']
      - name: subscribers
        tests: [not_null]

  - name: stg_anrt__fixed
    description: Fixed-line subscriptions by quarter
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: total_subs
        tests: [not_null]

  - name: stg_anrt__qos
    description: Quality-of-service indicators (aggregate — no per-operator breakdown in source)
    columns:
      - name: year
        tests: [not_null]
      - name: indicator
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: stg_anrt__traffic
    description: Voice and SMS outgoing traffic by segment and quarter
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: segment
        tests: [not_null]
      - name: voice_minutes
        tests: [not_null]

  - name: stg_anrt__arpm
    description: Average revenue per minute and average internet bill
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: arpm
        tests: [not_null]

  - name: stg_anrt__complaints
    description: Consumer complaints by type and quarter
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: complaint_count
        tests: [not_null]

  - name: stg_anrt__bandwidth
    description: International internet bandwidth capacity in Gbps
    columns:
      - name: year
        tests: [not_null]
      - name: capacity_gbps
        tests: [not_null]

  - name: stg_anrt__portability
    description: Mobile and fixed number portability per quarter
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: segment
        tests: [not_null]
      - name: ported_numbers
        tests: [not_null]

  - name: stg_anrt__usage_avg
    description: Average monthly outgoing usage (minutes) per subscriber
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']

  - name: stg_anrt__ip
    description: IP address usage — IPv4 count and IPv6 prefix count (annual)
    columns:
      - name: year
        tests: [not_null]
      - name: ipv4_count
        tests: [not_null]

  - name: stg_anrt__data_links
    description: Enterprise data link circuits by type and quarter
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: link_type
        tests: [not_null]
      - name: link_count
        tests: [not_null]

  - name: stg_anrt__tic_survey
    description: ICT survey results in long format (one row per indicator per year)
    columns:
      - name: year
        tests: [not_null]
      - name: indicator
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: stg_anrt__domains
    description: Active .ma domain name registrations per quarter
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: active_domains
        tests: [not_null]

  - name: stg_anrt__payphones
    description: Payphone (publiphone) count per quarter
    columns:
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: total_payphones
        tests: [not_null]
