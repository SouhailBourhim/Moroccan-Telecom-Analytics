version: 2

models:
  - name: stg_itu__morocco
    description: ITU ICT indicator data for Morocco (2000-2024)
    columns:
      - name: year
        tests: [not_null]
      - name: indicator_code
        tests:
          - not_null
          - accepted_values:
              values:
                - 'i271'
                - 'i112'
                - 'i271p'
                - 'i992b'
                - 'i271mw'
                - 'i99H'
                - 'i4214'
                - 'i741$'
              quote: true
      - name: indicator_name
        tests: [not_null]
      - name: value
        tests: [not_null]
