x-airflow-common: &airflow-common
  build: .
  image: morocco-telecom-airflow:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    ANRT_BASE_URL: ${ANRT_BASE_URL:-https://data.gov.ma/data/api/3/action/}
    ITU_API_BASE: ${ITU_API_BASE:-https://api.datahub.itu.int/v2}
    DATA_DIR: /opt/data
    RAW_DIR: /opt/data/raw
    WAREHOUSE_PATH: /opt/data/warehouse.duckdb
    PYTHONPATH: /opt/airflow
    POSTGRES_DSN: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-airflow}
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "10"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./ingestion:/opt/airflow/ingestion
    - ./great_expectations:/opt/airflow/great_expectations
    - ./dbt:/opt/dbt
    - ./data:/opt/data
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── Metadata DB ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging
    restart: always

  # ── Airflow init (one-shot) ─────────────────────────────────────────────────
  # The official entrypoint reads _AIRFLOW_DB_MIGRATE and _AIRFLOW_WWW_USER_CREATE
  # before executing the given command, so migration + admin user are handled
  # automatically without needing to run as root.
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_PASSWORD:?AIRFLOW_WWW_PASSWORD must be set in .env}
    restart: "no"

  # ── Airflow webserver ───────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow scheduler ───────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ── Metabase ────────────────────────────────────────────────────────────────
  metabase:
    build:
      context: .
      dockerfile: Dockerfile.metabase
    image: morocco-telecom-metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: UTC
      MB_PLUGINS_DIR: /plugins
    volumes:
      - metabase-data:/metabase-data
      - ./data:/opt/data:ro
      - ./metabase-plugins:/plugins
    logging: *default-logging
    restart: always

volumes:
  postgres-db-volume:
  airflow-logs:
  metabase-data:
